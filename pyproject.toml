[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bikeriders"
version = "0.1.0"
description = "Local-first bike and kit spotting — private video preparation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "opencv-python-headless>=4.10,<5", "numpy>=2,<2.3",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
bikeriders = "bikeriders.cli:main"

[tool.setuptools.package-data]
bikeriders = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

